# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:2.6.2
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
# version: '3'
x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider packages you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  image: lpoletto/airflow:airflow_2_6_2 #${AIRFLOW_IMAGE_NAME:-apache/airflow:2.6.2}
  # build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # For backward compatibility, with Airflow <2.3
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST}
    AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT}
    AIRFLOW__SMTP__SMTP_STARTTLS: True
    AIRFLOW__SMTP__SMTP_SSL: False
    AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM}
    JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64 # cambiar si necesita
  env_file:
    - .env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./data/raw:/opt/airflow/data/raw
    - ./data/staging:/opt/airflow/data/staging
    - ./data/processed:/opt/airflow/data/processed
    - ./spark_drivers/postgresql-42.5.2.jar:/tmp/drivers/postgresql-42.5.2.jar
    - ./spark_drivers/mysql-connector-j-8.0.32.jar:/tmp/drivers/mysql-connector-j-8.0.32.jar
    - ./spark_drivers/hadoop-aws-3.3.1.jar:/tmp/drivers/hadoop-aws-3.3.1.jar
    - ./spark_drivers/aws-java-sdk-bundle-1.11.375.jar:/tmp/drivers/aws-java-sdk-bundle-1.11.375.jar
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-50000}"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    hostname: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always # Base de datos crítica, siempre disponible

  airflow-webserver:
    <<: *airflow-common
    # command: python -m pip install yfinance && webserver
    command: webserver
    ports:
      - 8080:8080

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: on-failure  # Solo reinicia si falla

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: no  # Inicia manualmente cuando lo necesites

  airflow-init:
    <<: *airflow-common
    # yamllint disable rule:line-length
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  spark:
    image: lpoletto/spark:spark_3_4_1
    hostname: spark
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - '8090:8080'
      - '7077:7077'
    env_file:
      - .env
    volumes:
      - ./spark_drivers/postgresql-42.5.2.jar:/tmp/drivers/postgresql-42.5.2.jar
      - ./spark_drivers/mysql-connector-j-8.0.32.jar:/tmp/drivers/mysql-connector-j-8.0.32.jar
      - ./spark_drivers/hadoop-aws-3.3.1.jar:/tmp/drivers/hadoop-aws-3.3.1.jar
      - ./spark_drivers/aws-java-sdk-bundle-1.11.375.jar:/tmp/drivers/aws-java-sdk-bundle-1.11.375.jar
      - ./data/raw:/opt/airflow/data/raw
      - ./data/staging:/opt/airflow/data/staging
      - ./data/processed:/opt/airflow/data/processed
  
  spark-worker:
    image: lpoletto/spark:spark_3_4_1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    env_file:
      - .env
    volumes:
      - ./spark_drivers/postgresql-42.5.2.jar:/tmp/drivers/postgresql-42.5.2.jar
      - ./spark_drivers/mysql-connector-j-8.0.32.jar:/tmp/drivers/mysql-connector-j-8.0.32.jar
      - ./spark_drivers/hadoop-aws-3.3.1.jar:/tmp/drivers/hadoop-aws-3.3.1.jar
      - ./spark_drivers/aws-java-sdk-bundle-1.11.375.jar:/tmp/drivers/aws-java-sdk-bundle-1.11.375.jar
      - ./data/raw:/opt/airflow/data/raw
      - ./data/staging:/opt/airflow/data/staging
      - ./data/processed:/opt/airflow/data/processed

  # -----------------------------------------------------------
  # MySQL
  # -----------------------------------------------------------
  mysql:
    hostname: mysql
    image: mysql:8.0.32
    # container_name: mysql-1
    env_file:
      - .env
    ports:
      - "3306:3306"  # Mapeo el puerto 3307:3306 si en la máquina local al puerto 3306 dentro del contenedor
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/f1db.sql:/docker-entrypoint-initdb.d/f1db.sql
    # networks:
    #   - data-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "f1user", "-pf1password"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: always # Base de datos source, siempre disponible
  
  # -----------------------------------------------------------
  # MinIO
  # -----------------------------------------------------------
  minio:
    hostname: minio
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    # container_name: minio-1
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    env_file:
      - .env
    command: server /data --console-address ":9001"
    # networks:
    #   - data-network

  jupyter:
    image: jupyter/pyspark-notebook:2023-04-24
    hostname: jupyter
    env_file:
      - .env
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/develop/notebooks
      - ./spark_drivers/postgresql-42.5.2.jar:/tmp/drivers/postgresql-42.5.2.jar
      - ./spark_drivers/mysql-connector-j-8.0.32.jar:/tmp/drivers/mysql-connector-j-8.0.32.jar
      - ./spark_drivers/hadoop-aws-3.3.1.jar:/tmp/drivers/hadoop-aws-3.3.1.jar
      - ./spark_drivers/aws-java-sdk-bundle-1.11.375.jar:/tmp/drivers/aws-java-sdk-bundle-1.11.375.jar
      - ./data/raw:/home/develop/data/raw
      - ./data/staging:/home/develop/data/staging
      - ./data/processed:/home/develop/data/processed
    depends_on:
      - spark
      - mysql
      - minio
      - postgres
    restart: on-failure

volumes:
  postgres_data:
  mysql_data:
  minio_data: